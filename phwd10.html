<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Advanced Iframe Demo</title>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, sans-serif;
    }

    body {
        background: #eef2f7;
    }

    header {
        background: linear-gradient(45deg, #1e3c72, #2a5298);
        color: white;
        padding: 15px;
        text-align: center;
    }

    .layout {
        display: grid;
        grid-template-columns: 250px 1fr;
        height: 90vh;
    }

    .sidebar {
        background: #fff;
        padding: 15px;
        border-right: 2px solid #ddd;
    }

    .sidebar h3 {
        margin-bottom: 10px;
    }

    .sidebar a {
        display: block;
        padding: 8px;
        margin: 6px 0;
        background: #f4f4f4;
        text-decoration: none;
        color: #333;
        border-radius: 5px;
        transition: 0.3s;
    }

    .sidebar a:hover {
        background: #2a5298;
        color: white;
    }

    .content {
        display: grid;
        grid-template-rows: 1fr 1fr;
        gap: 10px;
        padding: 10px;
    }

    iframe {
        width: 100%;
        height: 100%;
        border: none;
        border-radius: 8px;
        background: white;
    }

    footer {
        text-align: center;
        padding: 10px;
        background: #333;
        color: white;
    }
</style>

</head>

<body>

<header>
    <h2>🌐 Iframe Dashboard (Maps + Web + Video)</h2>
</header>

<div class="layout">

    <!-- Sidebar -->
    <div class="sidebar">
        <h3>🌍 Websites</h3>
        <a href="https://www.wikipedia.org" target="topFrame">Wikipedia</a>
        <a href="https://www.example.com" target="topFrame">Example</a>

        <h3>🗺 Maps</h3>
        <a href="https://maps.google.com/maps?q=Nagpur&output=embed" target="bottomFrame">
            Nagpur Map
        </a>
        <a href="https://maps.google.com/maps?q=Mumbai&output=embed" target="bottomFrame">
            Mumbai Map
        </a>

        <h3>🎥 Video</h3>
        <a href="https://www.youtube.com/embed/dQw4w9WgXcQ" target="topFrame">
            Play Video
        </a>
    </div>

    <!-- Content Area -->
    <div class="content">
        <!-- Top iframe -->
        <iframe name="topFrame" src="https://www.example.com"></iframe>

        <!-- Bottom iframe -->
        <iframe name="bottomFrame"
            src="https://maps.google.com/maps?q=Nagpur&output=embed">
        </iframe>
    </div>

</div>

<footer>
    <p>Created using HTML Iframes | Demo Project</p>
</footer>

</body>
</html>
